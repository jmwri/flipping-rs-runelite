displayName=FlippingRS
author=jmwri
description=Keeps your flippingrs.com journal up to date on its own. Every Grand Exchange trade is recorded as it happens, and your watchlist and open flips are in the sidebar.
tags=grand exchange,ge,flip,flipping,merching,profit,journal,tracker,tax
plugins=com.flippingrs.FlippingRsPlugin
version=1.0.0
warning=FlippingRS sends your Grand Exchange trades (the item, how many, the price, the slot and world, and when), your open offers, what your Grand Exchange history shows, and your FlippingRS API key to flippingrs.com, a third-party service that is not run or checked by the RuneLite team. Like any website, it can see your IP address. Your character name is never sent. The plugin also reads and updates your flippingrs.com watchlists. You can switch all of this off at any time with the "Record trades" setting.
