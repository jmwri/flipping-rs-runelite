displayName=FlippingRS
author=jmwri
description=Automatically records your Grand Exchange trades to your flippingrs.com journal
tags=grand exchange,ge,flip,flipping,merching,profit,journal,tracker,tax
plugins=com.flippingrs.FlippingRsPlugin
version=1.0.0
warning=This plugin sends your Grand Exchange fills (item, quantity, price, gp value, slot, world and time), the state of your open offers, the rows of your Grand Exchange history screen, and your FlippingRS API key to flippingrs.com, a third-party server not controlled or verified by the RuneLite developers, and reads and edits your flippingrs.com watchlists from there. Your IP address is visible to that server as with any web request. Your RuneScape display name is not sent. You can turn this off at any time with the "Record trades" setting.
